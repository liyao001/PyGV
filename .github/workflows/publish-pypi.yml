name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # hatch-vcs needs tags to compute the package version.
      - name: Fetch tags for hatch-vcs
        run: git fetch --tags --force

      - name: Extract data from tag (subject for release builds)
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          subject=$(git for-each-ref "${GITHUB_REF}" --format='%(contents:subject)')
          {
            echo "subject<<EOF"
            echo "${subject}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require a version tag
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Publishing is only allowed from a git tag (got ${GITHUB_REF})."
            echo "Create a release tag newer than PyPI 0.1.9, e.g. 0.2.0."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify built version matches tag
        run: |
          python -m pip install --upgrade hatch
          tag="${GITHUB_REF_NAME#v}"
          version="$(hatch version)"
          if [[ "${version}" != "${tag}" ]]; then
            echo "hatch-vcs version '${version}' does not match tag '${GITHUB_REF_NAME}'."
            echo "Tag a numeric version greater than 0.1.9 before publishing."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
