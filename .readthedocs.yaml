# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    # hatch-vcs needs full history and tags; RTD clones are shallow by default.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags --force

sphinx:
  configuration: doc_source/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
